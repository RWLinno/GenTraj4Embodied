name: Verify trajectory inspector
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r inspector/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m inspector.audit experiments/data/val.h5 experiments/data/test.h5 --out audit-output --strict
      - run: python scripts/verify_inspector_report.py audit-output/report.json docs/report.json
